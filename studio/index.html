<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Madison – studio</title>
<style>
@font-face { font-family: Outfit; src: url(../assets/Outfit-Variable.ttf) format('truetype'); font-weight: 100 900; }
:root { --canvas:#f4f4f4; --brand:#4f45e3; --brand-soft:#8b84f2; --brand-tint:#ecebfd; --ink:#16161a; --ink2:#5f6068; --ink3:#9a9ba3; --line:#ececef; --pill:#eef0f2; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
body { font-family: Outfit, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--canvas); }
.layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; }
.cam { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
.abs { position: absolute; }
.lg { display: inline-block; flex: none; line-height: 0; }
.lg svg, .av svg { display: block; }
.stars { display: inline-flex; gap: 1px; vertical-align: -2px; }
.dots { display: inline-flex; gap: 3px; vertical-align: -1px; }
.dots i { border-radius: 50%; border: 1.5px solid #00aa6c; display: block; }
.mut { color: #6b6c74; } .sm { font-size: 13px; } .xs { font-size: 12px; }
b { font-weight: 600; }
.shadow { box-shadow: 0 24px 60px rgba(20,20,40,.09), 0 2px 8px rgba(20,20,40,.04); }

/* search card */
.scard { position: absolute; background: #fff; border-radius: 28px; overflow: hidden; box-shadow: 0 24px 60px rgba(20,20,40,.09), 0 2px 8px rgba(20,20,40,.05); }
.spill { position: absolute; height: 54px; border-radius: 27px; background: var(--pill); display: flex; align-items: center; gap: 14px; padding: 0 20px; font-size: 20px; white-space: nowrap; overflow: hidden; color: #202124; }
.rows { position: absolute; left: 14px; right: 14px; }
.rrow { position: absolute; left: 0; right: 0; height: 118px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 8px; background: #fff; border-bottom: 1px solid var(--line); }
.rname { font-size: 19px; color: #202124; }
.rmeta { font-size: 13.5px; color: #70757a; margin-top: 5px; white-space: nowrap; }
.rimg { width: 96px; height: 84px; border-radius: 6px; overflow: hidden; flex: none; }
.more { position: absolute; left: 14px; right: 14px; height: 46px; border-radius: 23px; background: var(--pill); display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px; color: #3c4043; }
.best { position: absolute; left: 22px; right: 22px; top: 520px; }
.btitle { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
.bgrid { display: flex; gap: 14px; } .bgrid > div { width: 150px; font-size: 12px; color: #555; }
.bimg { width: 150px; height: 120px; border-radius: 8px; overflow: hidden; margin-bottom: 6px; }

/* phone-like cards */
.pcard { position: absolute; width: 400px; height: 720px; background: #fff; border-radius: 28px; overflow: hidden; padding: 20px 20px; font-size: 14px; box-shadow: 0 24px 60px rgba(20,20,40,.09), 0 2px 8px rgba(20,20,40,.05); }
.mhead { display: flex; justify-content: space-between; align-items: center; font-size: 19px; margin-bottom: 6px; }
.mrow { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
.mhero { height: 170px; margin: 12px -20px; overflow: hidden; }
.micons { display: flex; justify-content: space-around; padding: 6px 0 14px; border-bottom: 1px solid var(--line); }
.micons div { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: #444; }
.msec { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 5px; }
.msec .big { font-size: 22px; font-weight: 500; }
.rat { display: flex; justify-content: space-between; font-size: 12px; color: #444; }
.ihead { display: flex; justify-content: space-between; align-items: center; font-size: 15px; margin-bottom: 14px; }
.istats { display: flex; align-items: center; gap: 20px; }
.istats > div:not(.iav) { display: flex; flex-direction: column; align-items: center; font-size: 12px; color: #555; }
.istats b { font-size: 17px; color: #111; }
.iav { width: 72px; height: 72px; border-radius: 50%; overflow: hidden; flex: none; margin-right: 6px; }
.ibio { display: flex; flex-direction: column; gap: 2px; font-size: 12px; margin: 12px 0; color: #333; }
.ibio .lnk { color: #00376b; }
.ibtn { display: flex; gap: 6px; } .ibtn span { flex: 1; height: 30px; border-radius: 8px; background: #efefef; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; }
.ibtn .f { background: #0095f6; color: #fff; } .ibtn .s { flex: none; width: 32px; }
.itabs { display: flex; justify-content: space-around; padding: 12px 0 8px; border-bottom: 1px solid #ddd; margin-bottom: 2px; }
.igrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; margin: 0 -20px; }
.igrid div { height: 118px; overflow: hidden; }
.inav { position: absolute; left: 0; right: 0; bottom: 0; height: 52px; background: #fff; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #eee; }

/* floating logos */
.flogo { position: absolute; width: 70px; height: 70px; margin: -35px 0 0 -35px; }
.flogo.wide { width: 200px; height: 60px; margin: -30px 0 0 -100px; }

/* owner + tasks */
.circle { position: absolute; overflow: hidden; }
.task { position: absolute; border: 2px solid rgba(79,69,227,.55); border-radius: 8px; padding: 14px 26px; font-size: 30px; line-height: 1.32; color: #1d1d24; background: rgba(244,244,244,.9); white-space: nowrap; box-shadow: 0 10px 30px rgba(20,20,60,.05); }

/* invoice */
.inv { position: absolute; width: 760px; background: #fff; border-radius: 26px; padding: 34px 32px 34px; box-shadow: 0 24px 60px rgba(20,20,40,.08); overflow: hidden; }
.invt { font-size: 31px; font-weight: 600; }
.chip { display: inline-block; margin-top: 18px; background: #f0f0f2; padding: 10px 16px; border-radius: 10px; font-size: 21px; font-weight: 500; }
.invh { display: flex; justify-content: space-between; font-size: 19px; margin: 36px 0 8px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.invr { display: flex; justify-content: space-between; font-size: 20px; padding: 20px 0; border-bottom: 1px solid var(--line); color: #2a2a30; }
.invb { display: flex; justify-content: flex-end; align-items: center; gap: 18px; margin-top: 26px; padding-right: 30px; }
.invb b { font-size: 20px; } .invb span { font-size: 40px; font-weight: 600; color: #e5322d; }

/* wordmark */
.wm { position: absolute; font-size: 200px; font-weight: 600; letter-spacing: -1px; color: var(--brand); white-space: nowrap; line-height: 1; }
.wm .ch { position: relative; display: inline-block; }
.wm .ch .a, .wm .ch .b { position: absolute; left: 0; top: 0; }
.sub { position: absolute; font-size: 40px; font-weight: 500; white-space: nowrap; color: #17171c; }
.sub .c { display: inline-block; white-space: pre; }
.dash { position: absolute; height: 4px; background: var(--brand-soft); border-radius: 2px; }
.lcard { position: absolute; background: #fff; border-radius: 30px; box-shadow: 0 30px 70px rgba(20,20,60,.10); }

/* dashboard */
.win { position: absolute; width: 1600px; height: 1000px; background: #fff; border-radius: 18px; overflow: hidden; box-shadow: 0 30px 80px rgba(10,10,40,.18); font-size: 15px; }
.top { position: absolute; left: 0; right: 0; top: 0; height: 74px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; padding: 0 34px; }
.wlogo { font-size: 30px; font-weight: 600; color: var(--brand); display: inline-block; transform-origin: 0 50%; }
.who { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 500; }
.av { display: inline-block; border-radius: 50%; overflow: hidden; flex: none; }
.av.init { background: #d9483b; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 18px; }
.side { position: absolute; left: 0; top: 74px; bottom: 0; width: 300px; border-right: 1px solid var(--line); padding: 26px 18px; }
.nav { position: relative; height: 50px; display: flex; align-items: center; gap: 14px; padding: 0 18px; font-size: 17px; font-weight: 500; color: #34343c; }
.navhi { position: absolute; left: 18px; right: 18px; height: 50px; border-radius: 8px; background: var(--brand-tint); border-left: 3px solid var(--brand); }
.org { font-size: 18px; font-weight: 600; letter-spacing: .3px; padding: 26px 18px 12px; color: #26262c; }
.main { position: absolute; left: 300px; top: 74px; right: 0; bottom: 0; overflow: hidden; }
.pg { position: absolute; left: 0; top: 0; width: 1300px; padding: 34px 44px; }
.welcome { font-size: 23px; font-weight: 600; margin-bottom: 22px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.stat { position: relative; border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; height: 218px; background: #fff; }
.sh { display: flex; justify-content: space-between; align-items: center; }
.sh b { font-size: 15px; }
.tag { font-size: 11px; color: var(--brand); background: #eceffe; padding: 3px 9px; border-radius: 10px; }
.sv { font-size: 32px; font-weight: 500; margin: 12px 0 10px; display: flex; align-items: center; gap: 10px; }
.srow { display: flex; align-items: center; gap: 12px; font-size: 15px; margin: 10px 0; }
.srow .delta { margin-left: auto; }
.delta { font-size: 11px; color: #16a34a; background: #dcfce7; padding: 2px 8px; border-radius: 10px; display: inline-flex; align-items: center; gap: 2px; }
.delta.abs { position: absolute; right: 22px; top: 70px; }
.kw { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin-top: 34px; font-size: 12px; color: #555; }
.kw span { border-bottom: 1px solid var(--line); padding-bottom: 6px; white-space: nowrap; } .kw i { font-style: normal; color: #aaa; }
.insights { border: 1px solid var(--line); border-radius: 14px; padding: 18px 22px; margin-top: 18px; }
.ins { display: flex; gap: 20px; margin-top: 14px; font-size: 13px; color: #444; }
.ins span { flex: 1; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; display: flex; align-items: center; gap: 8px; }
.lower { display: flex; gap: 18px; margin-top: 18px; align-items: flex-start; }
.pend { flex: 1; border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; min-height: 700px; }
.h { font-size: 20px; }
.rvlist { position: relative; margin-top: 18px; height: 620px; }
.pfh > div { white-space: nowrap; }
.rv { position: relative; margin-bottom: 14px; display: flex; gap: 16px; padding: 18px 16px; border: 1px solid #f1f1f3; border-radius: 12px; background: #fff; }
.rvb { display: flex; flex-direction: column; gap: 2px; font-size: 15px; }
.rvm { display: flex; align-items: center; gap: 10px; margin: 4px 0 8px; }
.rvb p { font-size: 14px; color: #4a4a52; line-height: 1.5; max-width: 640px; }
.camp { width: 420px; border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; }
.cal { margin-top: 24px; }
.calh { display: flex; justify-content: space-between; font-size: 15px; margin-bottom: 16px; }
.calg { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 14px; text-align: center; font-size: 13px; color: #333; }
.calg .wd { color: #999; font-size: 12px; } .calg .o { color: #bbb; }
.calg span { position: relative; }
.calg .dot::after { content: ''; position: absolute; left: 50%; bottom: -6px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: #333; }
.calg .today { outline: 1.5px solid #999; border-radius: 50%; width: 30px; height: 30px; line-height: 30px; margin: -7px auto 0; }
.sched { margin-top: 34px; display: flex; flex-direction: column; gap: 14px; font-size: 15px; }
.sc { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.sch { display: flex; justify-content: space-between; gap: 10px; } .sch b { max-width: 220px; }
.stack { display: flex; gap: 6px; margin-top: 6px; }
.need { align-self: flex-start; font-size: 11px; color: var(--brand); background: #eceffe; padding: 3px 10px; border-radius: 10px; }

/* integrations */
.intw { padding: 6px 0; }
.h1 { font-size: 30px; font-weight: 600; margin: 34px 0 6px; }
.intg { position: relative; margin-top: 30px; height: 600px; }
.ic { position: absolute; width: 590px; border: 1px solid var(--line); border-radius: 10px; background: #fff; overflow: hidden; }
.ich { height: 84px; display: flex; align-items: center; gap: 16px; padding: 0 20px; font-size: 19px; }
.cbtn { margin-left: auto; background: var(--brand); color: #fff; font-size: 14px; font-weight: 500; padding: 8px 14px; border-radius: 5px; transform-origin: 50% 50%; }
.ica { display: flex; justify-content: space-between; align-items: center; padding: 0 22px 0 22px; height: 60px; border-top: 1px solid #f3f3f5; font-size: 17px; color: #555; margin: 0 14px; }
.ica .rm { font-size: 13px; color: #777; }

/* business profile */
.prof { position: absolute; width: 640px; background: #fff; border-radius: 6px; padding: 22px 26px; overflow: hidden; box-shadow: 0 20px 50px rgba(20,20,40,.08); }
.pfh { display: flex; justify-content: space-between; } .pfh span { display: flex; gap: 14px; }
.pft { font-size: 23px; margin-bottom: 4px; }
.pfg { position: relative; height: 210px; margin-top: 18px; }
.pfg > div { position: absolute; overflow: hidden; border-radius: 4px; }
.pfa { display: flex; gap: 10px; margin-top: 18px; }
.pfa span { display: flex; align-items: center; gap: 6px; border: 1px solid #dadce0; border-radius: 16px; padding: 6px 11px; font-size: 13px; color: #1a1a1a; white-space: nowrap; }
.pftabs { position: relative; display: flex; justify-content: space-around; margin: 22px -26px 0; border-bottom: 1px solid #e5e5e5; font-size: 15px; font-weight: 500; }
.pftabs span { padding: 12px 0; color: #444; } .pftabs span.on { color: #111; }
.pftabs i { position: absolute; bottom: -1px; left: 0; width: 213px; height: 3px; background: #1a73e8; }
.pfs { margin-top: 20px; font-size: 15px; display: flex; gap: 8px; }
.pfs.col { flex-direction: column; gap: 6px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px 14px; width: 380px; font-size: 14px; color: #333; }
.opts span { display: inline-flex; align-items: center; gap: 4px; }
.soc { display: flex; gap: 18px; margin-top: 6px; }
.soc span { display: inline-block; }

/* modal */
.dim { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: rgba(60,60,70,.42); }
.modal { position: absolute; background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.22); }
.mdin { position: absolute; left: 0; top: 0; width: 600px; padding: 26px 28px; }
.mdh { display: flex; justify-content: space-between; align-items: center; font-size: 22px; }
.mdr { display: flex; gap: 14px; margin-top: 20px; padding-bottom: 26px; border-left: 2px solid #eee; margin-left: 22px; padding-left: 0; }
.mdr .av { margin-left: -24px; }
.mdr p { max-width: 460px; font-size: 16px; line-height: 1.6; color: #333; }
.mdy { display: flex; align-items: center; gap: 12px; font-size: 18px; margin-top: 8px; }
.mdy svg:last-child { margin-left: auto; }
.yav { width: 40px; height: 40px; border-radius: 50%; background: #eceffe; display: inline-flex; align-items: center; justify-content: center; }
.mdt { position: relative; margin: 18px 0 0 52px; height: 270px; border: 1px solid #e3e3e6; border-radius: 8px; padding: 16px 18px; font-size: 16px; line-height: 1.6; color: #333; white-space: pre-wrap; }
.mdt .sel { background: #d6d3fb; }
.caret { display: inline-block; width: 2px; height: 20px; background: #333; vertical-align: -4px; margin-left: 1px; }
.mdb { margin: 22px 0 0 52px; height: 52px; border-radius: 8px; background: var(--brand); color: #fff; font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: center; }

/* labels */
.flabel { position: absolute; display: flex; align-items: center; gap: 16px; color: #fff; font-size: 34px; font-weight: 600; white-space: nowrap; }
.flabel .fi { width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,.14); display: flex; align-items: center; justify-content: center; }
.bubble { position: absolute; background: #fff; border-radius: 16px; padding: 22px 30px; font-size: 32px; font-weight: 500; white-space: nowrap; box-shadow: 0 20px 50px rgba(0,0,0,.14); }

/* morph containers */
.clipbox { position: absolute; overflow: hidden; background: #fff; box-shadow: 0 24px 60px rgba(20,20,40,.09), 0 2px 8px rgba(20,20,40,.05); }
.clipbox.deep { box-shadow: 0 30px 80px rgba(10,10,40,.20); }
.morph { position: absolute; overflow: hidden; background: #fff; box-shadow: 0 24px 60px rgba(20,20,40,.10); }
.morph > .ctr { position: absolute; left: 50%; top: 50%; }
.ecirc { position: absolute; border-radius: 50%; background: var(--brand); }
.flabel .lt { display: inline-block; overflow: hidden; padding: 4px 0; }
.flabel .lt span { display: inline-block; }

/* cursor */
#cursor { position: absolute; left: 0; top: 0; width: 44px; height: 44px; transform-origin: 6px 4px; z-index: 50; pointer-events: none; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="../assets/logos.js"></script>
<script src="../assets/people.js"></script>
<script src="../assets/photos.js"></script>
<script src="lib.js"></script>
<script src="ui.js"></script>
<script>
// build the film only after Outfit is loaded (text is measured during build)
Promise.all([document.fonts.load('400 20px Outfit'), document.fonts.load('600 20px Outfit')]).then(() => {
  const s = document.createElement('script'); s.src = 'film.js'; document.body.appendChild(s);
});
</script>
</body>
</html>
